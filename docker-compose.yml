services:
  dyndns_nfsn:
    build: .
    image: ${DYNDNS_IMAGE:-dyndns_nfsn}:${DYNDNS_TAG:-latest}
    container_name: dyndns_nfsn
    restart: unless-stopped
    ports:
      - "56080:80"
    volumes:
      - ./config:/config
      - logs:/logs
    environment:
      SETTINGS_PATH: "/config/settings.json"
      WEB_PORT: "80"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
volumes:
  logs:
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}dyndns_nfsn | NearlyFreeSpeech.net DNS{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
      .navbar {
        margin: 0;
      }
    </style>
  </head>
  <body class="has-background-light">
    {% block body %}{% endblock %}

    <script>
      const burgerToggle = document.getElementById('burgerToggle');
      const navMenu = document.getElementById('navMenu');

      if (burgerToggle && navMenu) {
        burgerToggle.addEventListener('click', () => {
          const targetId = burgerToggle.dataset.target;
          const targetMenu = document.getElementById(targetId);
          if (targetMenu) {
            const isActive = targetMenu.classList.toggle('is-active');
            burgerToggle.classList.toggle('is-active', isActive);
            burgerToggle.setAttribute('aria-expanded', String(isActive));
          }
        });
      }
    </script>
  </body>
</html>
